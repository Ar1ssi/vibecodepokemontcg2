<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stadium board preview — Scorched Earth (design 077)</title>
    <script type="importmap">{"imports":{"three":"/src/vendor/three/three.module.min.js"}}</script>
    <style>
      html, body { margin: 0; height: 100%; background: #050506; overflow: hidden; font: 13px system-ui, sans-serif; color: #e8e2dc; }
      canvas { display: block; }
      #panel { position: fixed; top: 12px; left: 12px; background: rgba(12, 10, 10, 0.82); border: 1px solid #3a2a22; border-radius: 8px; padding: 10px 12px; display: grid; gap: 8px; min-width: 240px; z-index: 1; }
      #panel h1 { font-size: 14px; margin: 0; color: #ffb070; }
      #panel button { background: #2a1a12; color: #ffd8b0; border: 1px solid #6a3a20; border-radius: 5px; padding: 6px 8px; cursor: pointer; }
      #panel button:hover { background: #3a2216; }
      #panel label { display: flex; gap: 6px; align-items: center; justify-content: space-between; }
      #panel .row { display: flex; gap: 6px; }
      #panel .row button { flex: 1; }
      #panel.collapsed > :not(h1) { display: none; }
      #status { color: #a89888; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="panel">
      <h1 title="click to collapse">Scorched Earth — stadium board</h1>
      <div class="row">
        <button id="play">Play Stadium</button>
        <button id="discard">Discard</button>
      </div>
      <label>Heat <input id="heat" type="range" min="0" max="2" step="0.05" value="1" /></label>
      <label>Height <input id="relief" type="range" min="0" max="2" step="0.05" value="1" /></label>
      <label>Scrub reveal <input id="scrub" type="range" min="0" max="1" step="0.01" value="1" /></label>
      <label>Camera
        <select id="camera"><option value="tcgl">TCG Live</option><option value="tilt12">Tilt 12°</option></select>
      </label>
      <label><input id="static" type="checkbox" /> FX off (static frame)</label>
      <label><input id="cards" type="checkbox" checked /> Show cards</label>
      <div id="status"></div>
    </div>
    <script type="module">
      import * as THREE from 'three';
      import {
        SCORCHED_EARTH_VERTEX,
        SCORCHED_EARTH_FRAGMENT,
        EMBER_VERTEX,
        EMBER_FRAGMENT,
        MAX_ZONES,
        RELIEF_SEGMENTS,
      } from '/src/setup/board3d/stadium-environment-shader.mjs';
      import { flatLayout, halfFromViewport } from '/src/setup/board3d/board-layout.mjs';
      import { cameraFromCssTilt, cameraTcgLive } from '/src/setup/board3d/board-camera.mjs';
      import { tableBounds } from '/src/setup/board3d/table-uv.mjs';
      import { getMatLayout } from '/src/setup/sizing/mat-layouts.mjs';

      // Design 077 prototype: the real `sim` layout and board cameras, a stand-in mat and cards,
      // and the real shader. The board is rebuilt on resize, as board3d.js relayouts.
      const INTRO_MS = 1600;
      const EXIT_MS = 900;
      const AMBIENT_FPS = 30;
      const EMBER_COUNT = 60;
      const DEG = Math.PI / 180;

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera();
      const tableFrame = new THREE.Group();
      scene.add(tableFrame);

      const loader = new THREE.TextureLoader();
      const textureCache = new Map();
      const texture = (src) => {
        if (!textureCache.has(src)) {
          const t = loader.load(src, () => invalidate());
          t.colorSpace = THREE.SRGBColorSpace;
          t.anisotropy = 8;
          textureCache.set(src, t);
        }
        return textureCache.get(src);
      };
      const art = (n) => `/src/assets/custom-sets/customhb/${n}/high.webp`;
      const CARD_BACK = '/src/assets/cardback.png';
      const MAT = '/src/assets/playmats/board/1022-rubber-playmat-dash-eevee-1.webp';

      const uniforms = {
        uMin: { value: new THREE.Vector2() },
        uSize: { value: new THREE.Vector2() },
        uOrigin: { value: new THREE.Vector2() },
        uTime: { value: 0 },
        uReveal: { value: 0 },
        uExit: { value: 0 },
        uHeat: { value: 1 },
        uRelief: { value: 1 },
        uRiverY: { value: 0 },
        uZones: { value: Array.from({ length: MAX_ZONES }, () => new THREE.Vector4()) },
        uZoneCount: { value: 0 },
        uPixelRatio: { value: renderer.getPixelRatio() },
      };
      const environmentMaterial = new THREE.ShaderMaterial({
        vertexShader: SCORCHED_EARTH_VERTEX,
        fragmentShader: SCORCHED_EARTH_FRAGMENT,
        uniforms,
        transparent: true,
      });
      const emberMaterial = new THREE.ShaderMaterial({
        vertexShader: EMBER_VERTEX,
        fragmentShader: EMBER_FRAGMENT,
        uniforms,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
      });
      const emberGeometry = new THREE.BufferGeometry();
      emberGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(EMBER_COUNT * 3), 3));
      emberGeometry.setAttribute('aSeed', new THREE.BufferAttribute(new Float32Array(EMBER_COUNT * 4).map(() => Math.random()), 4));

      // Where a card actually lies inside a zone rect: the card box, centred.
      const centred = (rect, box) => ({ x: rect.x + (rect.w - box.w) / 2, y: rect.y + (rect.h - box.h) / 2, w: box.w, h: box.h });
      const union = (rects) => {
        const x = Math.min(...rects.map((r) => r.x));
        const y = Math.min(...rects.map((r) => r.y));
        return { x, y, w: Math.max(...rects.map((r) => r.x + r.w)) - x, h: Math.max(...rects.map((r) => r.y + r.h)) - y };
      };
      const footprintsOf = (side) => ({
        active: centred(side.active, side.cardBox.active),
        bench: side.bench.map((slot) => centred(slot, side.cardBox.bench)),
        prizes: side.prizes.map((slot) => centred(slot, side.cardBox.prizes)),
        prizeArea: union(side.prizes),
        deck: centred(side.deck, side.cardBox.deck),
        discard: centred(side.discard, side.cardBox.discard),
        lostZone: side.lostZone,
      });

      let board = null;
      let layout = null;
      let stadiumMesh = null;
      let cardsGroup = null;

      function buildBoard() {
        if (board) {
          tableFrame.remove(board);
          board.traverse((o) => o.geometry && o.geometry !== emberGeometry && o.geometry.dispose());
        }
        board = new THREE.Group();
        const viewport = { w: innerWidth, h: innerHeight };
        const half = halfFromViewport(viewport, 1);
        layout = flatLayout(getMatLayout('sim'), half, { viewport });
        const bounds = tableBounds(layout);
        const depth = layout.depth;

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(bounds.w * 2.4, bounds.h * 3), new THREE.MeshBasicMaterial({ color: 0x0a0a0c }));
        floor.position.set(0, depth, -2);
        board.add(floor);
        for (const far of [false, true]) {
          const mat = new THREE.Mesh(new THREE.PlaneGeometry(bounds.w, depth), new THREE.MeshBasicMaterial({ map: texture(MAT) }));
          mat.position.set(0, far ? depth * 1.5 : depth / 2, 0);
          if (far) mat.rotation.z = Math.PI;
          board.add(mat);
        }

        const self = footprintsOf(layout.self);
        const opp = footprintsOf(layout.opp);
        const zones = [];
        for (const side of [self, opp]) zones.push(side.active, ...side.bench, side.prizeArea, side.deck, side.discard, side.lostZone);
        zones.push(layout.stadium);
        zones.forEach((r, i) => uniforms.uZones.value[i].set(r.x, r.y, r.w, r.h));
        uniforms.uZoneCount.value = zones.length;
        uniforms.uMin.value.set(bounds.x, bounds.y);
        uniforms.uSize.value.set(bounds.w, bounds.h);
        uniforms.uRiverY.value = depth;
        uniforms.uOrigin.value.set(layout.stadium.x + layout.stadium.w / 2, layout.stadium.y + layout.stadium.h / 2);

        const reliefGeometry = new THREE.PlaneGeometry(bounds.w, bounds.h, RELIEF_SEGMENTS.x, RELIEF_SEGMENTS.y);
        reliefGeometry.translate(bounds.x + bounds.w / 2, bounds.y + bounds.h / 2, 0);
        const environment = new THREE.Mesh(reliefGeometry, environmentMaterial);
        environment.position.z = 0.75;
        environment.frustumCulled = false;
        environment.renderOrder = 1;
        board.add(environment);

        const embers = new THREE.Points(emberGeometry, emberMaterial);
        embers.frustumCulled = false;
        embers.renderOrder = 3;
        board.add(embers);

        cardsGroup = new THREE.Group();
        cardsGroup.visible = document.getElementById('cards').checked;
        const addCard = (src, rect, { rotated = false, sideways = false, lift = 3 } = {}) => {
          const [w, h] = sideways ? [rect.h, rect.w] : [rect.w, rect.h];
          const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: texture(src) }));
          mesh.position.set(rect.x + rect.w / 2, rect.y + rect.h / 2, lift);
          mesh.rotation.z = (rotated ? Math.PI : 0) + (sideways ? Math.PI / 2 : 0);
          mesh.renderOrder = 2;
          cardsGroup.add(mesh);
          return mesh;
        };
        addCard(art('083'), self.active);
        addCard(art('073'), self.bench[1]);
        addCard(art('086'), self.bench[3]);
        self.prizes.forEach((r) => addCard(CARD_BACK, r));
        addCard(CARD_BACK, self.deck);
        addCard(art('075'), opp.active, { rotated: true });
        addCard(art('074'), opp.bench[2], { rotated: true });
        opp.prizes.forEach((r) => addCard(CARD_BACK, r, { rotated: true }));
        addCard(CARD_BACK, opp.deck, { rotated: true });
        stadiumMesh = addCard(art('299'), layout.stadium, { lift: 4 });
        stadiumMesh.visible = inPlay || transition?.kind === 'intro';
        board.add(cardsGroup);
        tableFrame.add(board);

        renderer.setSize(viewport.w, viewport.h);
        const params = { viewportW: viewport.w, viewportH: viewport.h, nearHalf: half };
        const desc = document.getElementById('camera').value === 'tcgl'
          ? cameraTcgLive({ ...params, cardHeightPx: layout.self.cardBox.active.h })
          : cameraFromCssTilt(params);
        camera.fov = desc.fov;
        camera.aspect = desc.aspect;
        camera.near = desc.near;
        camera.far = desc.far;
        camera.position.set(...desc.position);
        camera.up.set(...desc.up);
        camera.lookAt(...desc.target);
        tableFrame.rotation.x = -desc.tiltDeg * DEG;
        camera.updateProjectionMatrix();
        const view = desc.viewOffset;
        camera.setViewOffset(view.fullWidth, view.fullHeight, view.x, view.y, view.width, view.height);
        invalidate();
      }

      // --- timeline: intro, steady, exit (design 077 § Timeline) ---
      const easeOutCubic = (t) => 1 - (1 - t) ** 3;
      const easeInQuad = (t) => t * t;
      let transition = null;
      let inPlay = false;
      const status = document.getElementById('status');
      const staticBox = document.getElementById('static');
      const setStatus = (text) => (status.textContent = text);

      const play = () => {
        inPlay = true;
        stadiumMesh.visible = true;
        uniforms.uExit.value = 0;
        if (staticBox.checked) {
          uniforms.uReveal.value = 1;
          transition = null;
          setStatus('in play (static)');
        } else {
          uniforms.uReveal.value = 0;
          transition = { kind: 'intro', start: performance.now(), ms: INTRO_MS };
          setStatus('intro 1600 ms');
        }
        invalidate();
      };
      const discard = () => {
        if (!inPlay) return;
        inPlay = false;
        stadiumMesh.visible = false;
        if (staticBox.checked) {
          uniforms.uReveal.value = 0;
          transition = null;
          setStatus('no Stadium');
        } else {
          transition = { kind: 'exit', start: performance.now(), ms: EXIT_MS };
          setStatus('exit 900 ms');
        }
        invalidate();
      };

      document.querySelector('#panel h1').onclick = () => document.getElementById('panel').classList.toggle('collapsed');
      document.getElementById('play').onclick = play;
      document.getElementById('discard').onclick = discard;
      for (const [id, uniform] of [['heat', 'uHeat'], ['relief', 'uRelief']]) {
        document.getElementById(id).oninput = (e) => {
          uniforms[uniform].value = Number(e.target.value);
          invalidate();
        };
      }
      document.getElementById('scrub').oninput = (e) => {
        transition = null;
        inPlay = true;
        stadiumMesh.visible = true;
        uniforms.uExit.value = 0;
        uniforms.uReveal.value = Number(e.target.value);
        setStatus(`reveal ${Number(e.target.value).toFixed(2)}`);
        invalidate();
      };
      document.getElementById('camera').onchange = buildBoard;
      staticBox.onchange = () => invalidate();
      document.getElementById('cards').onchange = (e) => {
        cardsGroup.visible = e.target.checked;
        invalidate();
      };

      // --- render loop: full rate during a transition, 30 fps ambient, none when static ---
      let frameId = null;
      let ambientTimer = null;
      let lastAmbient = 0;
      const startedAt = performance.now();
      let frozenTime = 0;

      function invalidate() {
        if (frameId !== null) return;
        frameId = requestAnimationFrame(render);
      }

      function render(now) {
        frameId = null;
        if (!staticBox.checked) frozenTime = (now - startedAt) / 1000;
        uniforms.uTime.value = frozenTime;
        if (transition) {
          const t = Math.min(1, (now - transition.start) / transition.ms);
          if (transition.kind === 'intro') uniforms.uReveal.value = easeOutCubic(t);
          else uniforms.uExit.value = easeInQuad(t);
          if (t >= 1) {
            if (transition.kind === 'exit') {
              uniforms.uReveal.value = 0;
              uniforms.uExit.value = 0;
            }
            setStatus(transition.kind === 'intro' ? 'in play (ambient 30 fps)' : 'no Stadium');
            transition = null;
          }
        }
        renderer.render(scene, camera);
        if (transition) {
          invalidate();
          return;
        }
        const ambient = inPlay && !staticBox.checked && !document.hidden;
        if (ambient && ambientTimer === null) {
          const wait = Math.max(0, 1000 / AMBIENT_FPS - (now - lastAmbient));
          ambientTimer = setTimeout(() => {
            ambientTimer = null;
            lastAmbient = performance.now();
            invalidate();
          }, wait);
        }
      }

      addEventListener('resize', buildBoard);
      document.addEventListener('visibilitychange', () => invalidate());
      buildBoard();
      stadiumMesh.visible = false;
      setStatus('no Stadium — press Play Stadium');
      setTimeout(play, 600);
    </script>
  </body>
</html>
