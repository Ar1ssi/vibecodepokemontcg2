<!doctype html>
<!-- Design 074: a bench for the three.js board scene (board-scene.js + table-mesh.js) outside the
     game. Open /dev/board-lab (or /src/dev/board-lab.html) with the game server running.
     ?mat=<catalog id> picks a playmat through the game's own resolution (mat-spec.mjs; default: the
     sim board with no art), ?viewport=WxH renders at a fixed size. Not linked from the game. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Board 3D lab</title>
    <script type="importmap">{"imports":{"three":"/src/vendor/three/three.module.min.js"}}</script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #11161c;
        color: #dfe7ee;
        font: 14px/1.4 system-ui, sans-serif;
        overflow: hidden;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #stage.lab--fixed {
        inset: auto;
        top: 0;
        left: 0;
      }
      #stage canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .lab__bar {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        padding: 8px 12px;
        background: rgba(0, 0, 0, 0.45);
        z-index: 2;
      }
      .lab__bar label {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .lab__bar output {
        min-width: 4ch;
        font-variant-numeric: tabular-nums;
      }
      #stats {
        position: fixed;
        right: 12px;
        bottom: 12px;
        margin: 0;
        padding: 8px 10px;
        background: rgba(0, 0, 0, 0.55);
        border-radius: 6px;
        font: 12px/1.4 ui-monospace, monospace;
        z-index: 2;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="lab__bar">
      <label>Tilt <input id="tilt" type="range" min="0" max="40" step="0.5" value="12" /><output id="tiltOut">12</output>°</label>
      <label>Perspective <input id="perspective" type="range" min="400" max="4000" step="50" value="1400" /><output id="perspectiveOut">1400</output>px</label>
      <label>Light <input id="light" type="range" min="0" max="4" step="0.1" value="1.4" /><output id="lightOut">1.4</output></label>
    </div>
    <div id="stage"><canvas id="labCanvas" aria-hidden="true"></canvas></div>
    <pre id="stats">loading…</pre>
    <script type="module">
      const stats = document.getElementById('stats');
      const showError = (message) => {
        stats.textContent = message;
      };

      const parseViewport = (text) => {
        const match = /^(\d+)x(\d+)$/i.exec(text || '');
        if (!match) return null;
        const w = Number(match[1]);
        const h = Number(match[2]);
        return w > 0 && h > 0 ? { w, h } : null;
      };

      async function boot() {
        const [
          THREE,
          { RoomEnvironment },
          { createRenderer },
          { createTextureCache },
          { createBoardScene },
          { createSceneClock },
          { createMatTextureLoader },
          { flatLayout, halfFromViewport },
          { cameraFromCssTilt },
          { matSpecFor, isTwoPlayerMat },
          { getMatById },
          { getMatLayout },
        ] = await Promise.all([
          import('three'),
          import('/src/vendor/three/RoomEnvironment.js'),
          import('/src/setup/gl/gl-renderer.js'),
          import('/src/setup/gl/gl-textures.js'),
          import('/src/setup/board3d/board-scene.js'),
          import('/src/setup/board3d/scene-clock.js'),
          import('/src/setup/board3d/table-mesh.js'),
          import('/src/setup/board3d/board-layout.mjs'),
          import('/src/setup/board3d/board-camera.mjs'),
          import('/src/setup/sizing/mat-spec.mjs'),
          import('/src/setup/deck-builder/core/mats.mjs'),
          import('/src/setup/sizing/mat-layouts.mjs'),
        ]);
        const params = new URLSearchParams(location.search);
        const host = document.getElementById('stage');
        const fixedViewport = parseViewport(params.get('viewport'));
        if (fixedViewport) {
          host.classList.add('lab--fixed');
          host.style.width = `${fixedViewport.w}px`;
          host.style.height = `${fixedViewport.h}px`;
        }

        const canvas = document.getElementById('labCanvas');
        let contextLost = false;
        const gl = createRenderer({
          canvas,
          onLost: () => {
            contextLost = true;
            showError('WebGL context lost (reload the lab)');
          },
        });
        if (!gl) {
          showError('WebGL2 unavailable');
          return;
        }
        const { renderer } = gl;
        const clock = createSceneClock(canvas);
        clock.start();
        const scene = createBoardScene({
          host,
          canvas,
          renderer,
          textures: createTextureCache({ loader: createMatTextureLoader(THREE) }),
          clock,
          three: THREE,
          RoomEnvironment,
        });

        // The same records the game's mat picker applies; a one-player mat is shown on both halves.
        const matId = params.get('mat');
        const mat = matId ? getMatById(matId) : null;
        const spec = mat
          ? matSpecFor({ self: mat, opp: isTwoPlayerMat(mat) ? null : mat })
          : { mode: 'two-player', src: null, fit: '100% 100%', profile: getMatLayout('sim'), scale: 1 };
        const matStatus = mat ? `mat: ${mat.id} (${spec.mode}, ${spec.fit})` : matId ? `mat: unknown id ${matId}` : 'mat: sim, no art';
        scene.setMat(spec);

        const controls = { tilt: 12, perspective: 1400 };
        const viewportOf = () => fixedViewport || { w: host.clientWidth, h: host.clientHeight };
        const relayout = () => {
          const viewport = viewportOf();
          if (!(viewport.w > 0 && viewport.h > 0)) return;
          const half = halfFromViewport(viewport);
          scene.setViewport(viewport);
          scene.setCamera(
            cameraFromCssTilt({
              viewportW: viewport.w,
              viewportH: viewport.h,
              tiltDeg: controls.tilt,
              perspectivePx: controls.perspective,
              nearHalf: half,
            })
          );
          scene.setLayout(flatLayout(spec.profile, half, { viewport, matScale: spec.scale ?? 1 }));
        };
        new ResizeObserver(relayout).observe(host);

        const bindSlider = (id, apply) => {
          const input = document.getElementById(id);
          const out = document.getElementById(`${id}Out`);
          const update = () => {
            out.textContent = input.value;
            apply(Number(input.value));
          };
          input.addEventListener('input', update);
          update();
        };
        bindSlider('tilt', (deg) => {
          controls.tilt = deg;
          relayout();
        });
        bindSlider('perspective', (px) => {
          controls.perspective = px;
          relayout();
        });
        const light = scene.inspect().scene.getObjectByName('board3d-key-light');
        bindSlider('light', (intensity) => {
          if (light) light.intensity = intensity;
          scene.invalidate();
        });

        let lastFrame = renderer.info.render.frame;
        let lastTime = performance.now();
        const writeStats = () => {
          const now = performance.now();
          const frame = renderer.info.render.frame;
          const fps = Math.round(((frame - lastFrame) * 1000) / Math.max(1, now - lastTime));
          lastFrame = frame;
          lastTime = now;
          const viewport = viewportOf();
          stats.textContent = [
            `renders/s  ${fps}`,
            `textures   ${renderer.info.memory.textures}`,
            `calls      ${renderer.info.render.calls}`,
            `viewport   ${viewport.w}×${viewport.h}`,
            matStatus,
            contextLost ? 'context lost' : '',
          ]
            .filter(Boolean)
            .join('\n');
        };
        setInterval(writeStats, 1000);
        writeStats();
      }

      boot().catch((error) => showError(`lab failed: ${error?.message || error}`));
    </script>
  </body>
</html>
