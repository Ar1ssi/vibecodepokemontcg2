services:
  - type: web
    name: ptcg-sim
    runtime: node
    plan: free
    # design 088: the install's `postinstall` hook bundles the client into client/dist/ on a deploy
    # host (scripts/build-client.mjs); the server serves it with year-long caching.
    buildCommand: pnpm install --frozen-lockfile
    startCommand: node server/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # design 088: '1' makes the server request its own URL every 10 minutes, so the free instance
      # is never stopped for idling (no ~1 minute wait for the first visitor). An always-on service
      # uses about 730 of the 750 free instance hours a workspace gets per month, so only this
      # service may have it, and it stays '0' until the owner decides.
      - key: KEEP_AWAKE
        value: '0'
      # The Socket.IO admin UI (https://admin.socket.io, user `admin`) stays off until this is set
      # in the Render dashboard (server/access-policy.mjs).
      - key: ADMIN_PASSWORD
        sync: false
      # design 069: public URL of the R2 bucket holding the TCG Live foil textures (pnpm foil:upload);
      # unset = every card keeps the CSS holo. Set in the Render dashboard.
      - key: FOIL_TEXTURE_URL
        sync: false
      # design 076: public URL of the bucket prefix holding published custom sets (pnpm custom-sets:publish);
      # unset = FOIL_TEXTURE_URL + /custom-sets, `off` = only the sets committed in git.
      - key: CUSTOM_SETS_URL
        sync: false

  # Staging clone of ptcg-sim with the ?e2e=1 test bridge armed (PTCG_E2E=1), so the
  # Playwright playtest bot (scripts/e2e/playtest-bot.mjs) can run against a real Render deploy without
  # opening the bridge on the production service (server/server.js's E2E_ENABLED gate).
  # Run the bot against this service with: PTCG_URL=https://ptcg-sim-staging.onrender.com node scripts/e2e/playtest-bot.mjs --games=10
  - type: web
    name: ptcg-sim-staging
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile
    startCommand: node server/server.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # design 069: public URL of the R2 bucket holding the TCG Live foil textures (pnpm foil:upload);
      # unset = every card keeps the CSS holo. Set in the Render dashboard.
      - key: FOIL_TEXTURE_URL
        sync: false
      # design 076: public URL of the bucket prefix holding published custom sets (pnpm custom-sets:publish);
      # unset = FOIL_TEXTURE_URL + /custom-sets, `off` = only the sets committed in git.
      - key: CUSTOM_SETS_URL
        sync: false
      - key: PTCG_E2E
        value: '1'